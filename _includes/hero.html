<header class="hero">
    <div class="hero-bg-grid"></div>
    <div class="hero-glow"></div>
    <div class="hero-brand">
        <img src="assets/images/logo/LogoGestoq.png" data-i18n-alt="hero.alt.logo" alt="" class="hero-brand-logo">
        <span class="hero-brand-name">Gestoq</span>
    </div>
    <div class="hero-content">
        <div class="hero-text">
            <div class="hero-badge">
                <span class="badge-dot" aria-hidden="true"></span>
                <span data-i18n="hero.badge"></span>
            </div>
            <h1 class="hero-title">
                <span data-i18n="hero.title"></span><br>
                <span class="gradient-text" data-i18n="hero.title.gradient"></span>
            </h1>
            <p class="hero-subtitle" data-i18n="hero.subtitle"></p>
            <div class="hero-actions">
                <a href="https://play.google.com/store/apps/details?id=com.gestoq.app" target="_blank" rel="noopener" class="btn btn-primary" data-i18n-aria="hero.btn.download.aria">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.609 1.814L13.792 12 3.61 22.186a.996.996 0 0 1-.61-.92V2.734a1 1 0 0 1 .609-.92zm10.89 10.893l2.302 2.302-10.937 6.333 8.635-8.635zm3.199-3.198l2.807 1.626a1 1 0 0 1 0 1.73l-2.808 1.626L15.495 12l2.203-2.491zM5.864 2.658L16.802 8.99l-2.302 2.302-8.636-8.635z"/></svg>
                    <span data-i18n="hero.btn.download"></span>
                </a>
                <a href="#features" class="btn btn-ghost" data-i18n="hero.btn.features"></a>
            </div>
            <div class="hero-stats">
                <div class="stat">
                    <span class="stat-number" data-i18n="hero.stat1.number"></span>
                    <span class="stat-label" data-i18n="hero.stat1.label"></span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat">
                    <span class="stat-number" data-i18n="hero.stat2.number"></span>
                    <span class="stat-label" data-i18n="hero.stat2.label"></span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat">
                    <span class="stat-number" data-i18n="hero.stat3.number"></span>
                    <span class="stat-label" data-i18n="hero.stat3.label"></span>
                </div>
            </div>
        </div>
        <div class="hero-visual">
            <div class="floating-card floating-card-scan">
                <div class="floating-card-icon floating-card-icon-green">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M3 17v2a2 2 0 0 0 2 2h2M21 7V5a2 2 0 0 0-2-2h-2M21 17v2a2 2 0 0 1-2 2h-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
                </div>
                <div class="floating-card-text">
                    <div class="floating-card-title" data-i18n="hero.card.scan.title"></div>
                    <div class="floating-card-sub">7501234567890</div>
                </div>
            </div>
            <div class="floating-card floating-card-alert">
                <div class="floating-card-icon floating-card-icon-orange">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                </div>
                <div class="floating-card-text">
                    <div class="floating-card-title" data-i18n="hero.card.alert.title"></div>
                    <div class="floating-card-sub" data-i18n="hero.card.scan.sub"></div>
                </div>
            </div>
            <div class="hero-mockup">
                <div class="phone-frame">
                    <div class="phone-notch"></div>
                    <div class="phone-screen">
                        <div class="mockup-app">
                            <div class="mockup-statusbar">
                                <span>9:41</span>
                                <div class="mockup-status-icons">
                                    <div class="mockup-signal"></div>
                                    <div class="mockup-battery"></div>
                                </div>
                            </div>
                            <div class="mockup-header">
                                <div>
                                    <div class="mockup-greeting" data-i18n="hero.mockup.greeting"></div>
                                    <div class="mockup-date" data-i18n="hero.mockup.date"></div>
                                </div>
                                <div class="mockup-circle"></div>
                            </div>
                            <div class="mockup-cards">
                                <div class="mockup-card mockup-card-blue">
                                    <div class="mockup-card-icon">📦</div>
                                    <div class="mockup-card-value">1,248</div>
                                    <div class="mockup-card-label" data-i18n="hero.mockup.card1.label"></div>
                                </div>
                                <div class="mockup-card mockup-card-green">
                                    <div class="mockup-card-icon">✓</div>
                                    <div class="mockup-card-value">892</div>
                                    <div class="mockup-card-label" data-i18n="hero.mockup.card2.label"></div>
                                </div>
                                <div class="mockup-card mockup-card-orange">
                                    <div class="mockup-card-icon">⚠</div>
                                    <div class="mockup-card-value">42</div>
                                    <div class="mockup-card-label" data-i18n="hero.mockup.card3.label"></div>
                                </div>
                                <div class="mockup-card mockup-card-purple">
                                    <div class="mockup-card-icon">$</div>
                                    <div class="mockup-card-value">12.4K</div>
                                    <div class="mockup-card-label" data-i18n="hero.mockup.card4.label"></div>
                                </div>
                            </div>
                            <div class="mockup-chart-section">
                                <div class="mockup-chart-label" data-i18n="hero.mockup.chart.label"></div>
                                <div class="mockup-chart">
                                    <div class="mockup-chart-bar" style="height: 40%"></div>
                                    <div class="mockup-chart-bar" style="height: 65%"></div>
                                    <div class="mockup-chart-bar" style="height: 50%"></div>
                                    <div class="mockup-chart-bar" style="height: 85%"></div>
                                    <div class="mockup-chart-bar" style="height: 70%"></div>
                                    <div class="mockup-chart-bar" style="height: 95%"></div>
                                    <div class="mockup-chart-bar" style="height: 60%"></div>
                                </div>
                            </div>
                            <div class="mockup-recent">
                                <div class="mockup-recent-label" data-i18n="hero.mockup.recent.label"></div>
                                <div class="mockup-recent-item">
                                    <div class="mockup-recent-dot mockup-recent-dot-blue"></div>
                                    <div class="mockup-recent-info">
                                        <div class="mockup-recent-name" data-i18n="hero.mockup.recent1.name"></div>
                                        <div class="mockup-recent-stock" data-i18n="hero.mockup.recent1.stock"></div>
                                    </div>
                                    <div class="mockup-recent-price">$1.50</div>
                                </div>
                                <div class="mockup-recent-item">
                                    <div class="mockup-recent-dot mockup-recent-dot-green"></div>
                                    <div class="mockup-recent-info">
                                        <div class="mockup-recent-name" data-i18n="hero.mockup.recent2.name"></div>
                                        <div class="mockup-recent-stock" data-i18n="hero.mockup.recent2.stock"></div>
                                    </div>
                                    <div class="mockup-recent-price">$2.20</div>
                                </div>
                                <div class="mockup-recent-item">
                                    <div class="mockup-recent-dot mockup-recent-dot-orange"></div>
                                    <div class="mockup-recent-info">
                                        <div class="mockup-recent-name" data-i18n="hero.mockup.recent3.name"></div>
                                        <div class="mockup-recent-stock" data-i18n="hero.mockup.recent3.stock"></div>
                                    </div>
                                    <div class="mockup-recent-price">$1.10</div>
                                </div>
                            </div>
                            <div class="mockup-nav">
                                <div class="mockup-nav-item active"></div>
                                <div class="mockup-nav-item"></div>
                                <div class="mockup-nav-item"></div>
                                <div class="mockup-nav-item"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="hero-trust">
        <div class="trust-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span data-i18n="hero.trust1"></span>
        </div>
        <div class="trust-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span data-i18n="hero.trust2"></span>
        </div>
        <div class="trust-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
            <span data-i18n="hero.trust3"></span>
        </div>
    </div>
</header>
